<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: transparent;
      width: 520px;
      height: 340px;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a0a2e 50%, #0d1b3e 100%);
      border-radius: 16px;
      border: 1px solid rgba(124, 58, 237, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.8), 0 0 60px rgba(124, 58, 237, 0.15);
    }

    /* Animated background orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      animation: float 6s ease-in-out infinite;
    }
    .orb-1 {
      width: 200px; height: 200px;
      background: rgba(124, 58, 237, 0.25);
      top: -60px; left: -60px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 150px; height: 150px;
      background: rgba(59, 130, 246, 0.2);
      bottom: -40px; right: -40px;
      animation-delay: 2s;
    }
    .orb-3 {
      width: 100px; height: 100px;
      background: rgba(167, 139, 250, 0.2);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-15px) scale(1.05); }
    }

    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Logo icon */
    .logo-wrap {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.5);
      animation: pulse-logo 2s ease-in-out infinite;
    }

    @keyframes pulse-logo {
      0%, 100% { box-shadow: 0 8px 32px rgba(124, 58, 237, 0.5); }
      50% { box-shadow: 0 8px 48px rgba(124, 58, 237, 0.8), 0 0 0 8px rgba(124, 58, 237, 0.1); }
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .subtitle {
      font-size: 13px;
      color: rgba(167, 139, 250, 0.8);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Loading bar */
    .loading-wrap {
      width: 240px;
      margin-top: 8px;
    }

    .loading-track {
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7c3aed, #3b82f6, #a78bfa);
      border-radius: 4px;
      animation: load-progress 3s ease-out forwards;
    }

    @keyframes load-progress {
      0%   { width: 0%; }
      20%  { width: 30%; }
      50%  { width: 65%; }
      80%  { width: 88%; }
      100% { width: 95%; }
    }

    .loading-text {
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.7; }
    }

    /* Dots spinner */
    .dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.7);
      animation: bounce-dot 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce-dot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .version {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 10px;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="splash">
    <!-- Background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Main content -->
    <div class="content">
      <div class="logo-wrap">🏢</div>
      <div>
        <div class="title">Professional Services</div>
        <div class="subtitle">Platform</div>
      </div>

      <div class="loading-wrap">
        <div class="loading-track">
          <div class="loading-bar"></div>
        </div>
        <div class="loading-text">Loading application...</div>
      </div>

      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="version">v1.0.0</div>
  </div>
</body>
</html>
