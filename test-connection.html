<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-box {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔌 Frontend ↔ Backend Connection Test</h1>
    
    <div class="test-box">
        <h2>1. Backend API Test</h2>
        <button onclick="testBackend()">Test Backend Connection</button>
        <div id="backend-status"></div>
        <pre id="backend-response"></pre>
    </div>

    <div class="test-box">
        <h2>2. Frontend Environment</h2>
        <div id="frontend-info">
            <p><strong>Current URL:</strong> <span id="current-url"></span></p>
            <p><strong>API URL:</strong> <span id="api-url"></span></p>
        </div>
    </div>

    <div class="test-box">
        <h2>3. Authentication Test</h2>
        <button onclick="testLogin()">Test Login Endpoint</button>
        <div id="auth-status"></div>
        <pre id="auth-response"></pre>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api';
        
        // Display frontend info
        document.getElementById('current-url').textContent = window.location.href;
        document.getElementById('api-url').textContent = API_URL;

        async function testBackend() {
            const statusDiv = document.getElementById('backend-status');
            const responseDiv = document.getElementById('backend-response');
            
            statusDiv.innerHTML = '<div class="status loading">⏳ Testing backend connection...</div>';
            responseDiv.textContent = '';

            try {
                const response = await fetch(`${API_URL}/products/index.php`);
                const data = await response.json();

                if (data.success) {
                    statusDiv.innerHTML = `
                        <div class="status success">
                            ✅ Backend Connected Successfully!<br>
                            Found ${data.data.length} products
                        </div>
                    `;
                    responseDiv.textContent = JSON.stringify(data, null, 2);
                } else {
                    statusDiv.innerHTML = '<div class="status error">❌ Backend returned error</div>';
                    responseDiv.textContent = JSON.stringify(data, null, 2);
                }
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="status error">
                        ❌ Connection Failed!<br>
                        Error: ${error.message}<br>
                        Make sure backend is running on port 8000
                    </div>
                `;
                responseDiv.textContent = error.stack;
            }
        }

        async function testLogin() {
            const statusDiv = document.getElementById('auth-status');
            const responseDiv = document.getElementById('auth-response');
            
            statusDiv.innerHTML = '<div class="status loading">⏳ Testing login endpoint...</div>';
            responseDiv.textContent = '';

            try {
                const response = await fetch(`${API_URL}/auth/login.php`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@example.com',
                        password: 'Admin@12345'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.innerHTML = `
                        <div class="status success">
                            ✅ Login Successful!<br>
                            User: ${data.data.user.name}<br>
                            Role: ${data.data.user.role}<br>
                            Token received: Yes ✓
                        </div>
                    `;
                    // Don't show token in response for security
                    const safeData = {...data};
                    safeData.data.token = '***TOKEN_HIDDEN***';
                    responseDiv.textContent = JSON.stringify(safeData, null, 2);
                } else {
                    statusDiv.innerHTML = `<div class="status error">❌ ${data.message}</div>`;
                    responseDiv.textContent = JSON.stringify(data, null, 2);
                }
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="status error">
                        ❌ Connection Failed!<br>
                        Error: ${error.message}
                    </div>
                `;
                responseDiv.textContent = error.stack;
            }
        }

        // Auto-test on load
        window.onload = () => {
            setTimeout(() => {
                testBackend();
            }, 500);
        };
    </script>
</body>
</html>
